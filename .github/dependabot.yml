# The actions in .github/workflows are pinned to commit SHAs, with the version as a comment.
# Dependabot opens a pull request when a new version comes out, with the SHA and the comment
# updated together, so that the pin stays current without anyone looking it up by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
