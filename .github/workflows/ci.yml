name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck + build
        run: pnpm build

      - name: Typecheck + build (web version)
        run: pnpm build:web

      - name: Test the script that sets the version of a release
        run: node --test .github/scripts/*.test.mjs

      # Node strips the types of the TypeScript the tests import itself
      - name: Test the frontend logic
        run: node --test src/*.test.mjs

  rust:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The core is built without Tauri for the web version, which has to stay warning free too
      - name: Clippy (core without Tauri)
        run: cargo clippy -p hitomi-core --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check
        run: cargo check --workspace --locked

      # What a release does, on this disposable checkout: after the version of a tag is written,
      # the lockfile still matches and the versions still agree (`versions_are_in_step`)
      - name: The version of a release keeps the lockfile and the files in step
        run: |
          node .github/scripts/set-version.mjs v9.8.7
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo test --locked -p hitomi-core versions_are_in_step

  server:
    name: Server (build without GTK/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately no GTK/WebKit packages: the web version must build without them
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the server
        run: cargo build -p hitomi-server --locked

      - name: The binary links no GTK/WebKit
        run: |
          ! ldd target/debug/hitomi-server | grep -Ei 'gtk|webkit|soup|javascriptcore'
