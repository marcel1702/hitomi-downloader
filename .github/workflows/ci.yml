name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck + build
        run: pnpm build

      - name: Typecheck + build (web version)
        run: pnpm build:web

  rust:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The core is built without Tauri for the web version, which has to stay warning free too
      - name: Clippy (core without Tauri)
        run: cargo clippy -p hitomi-core --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check
        run: cargo check --workspace --locked

  server:
    name: Server (build without GTK/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no GTK/WebKit packages: the web version must build without them
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the server
        run: cargo build -p hitomi-server --locked

      - name: The binary links no GTK/WebKit
        run: |
          ! ldd target/debug/hitomi-server | grep -Ei 'gtk|webkit|soup|javascriptcore'
