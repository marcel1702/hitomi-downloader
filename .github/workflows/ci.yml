name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck + build
        run: pnpm build

      - name: Typecheck + build (web version)
        run: pnpm build:web

      - name: Test the script that sets the version of a release
        run: node --test .github/scripts/*.test.mjs

  rust:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The core is built without Tauri for the web version, which has to stay warning free too
      - name: Clippy (core without Tauri)
        run: cargo clippy -p hitomi-core --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check
        run: cargo check --workspace --locked

      # What a release does, on this disposable checkout: after the version of a tag is written,
      # the lockfile still matches and the versions still agree (`versions_are_in_step`)
      - name: The version of a release keeps the lockfile and the files in step
        run: |
          node .github/scripts/set-version.mjs v9.8.7
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo test --locked -p hitomi-core versions_are_in_step

  server:
    name: Server (build without GTK/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deliberately no GTK/WebKit packages: the web version must build without them
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the server
        run: cargo build -p hitomi-server --locked

      - name: The binary links no GTK/WebKit
        run: |
          ! ldd target/debug/hitomi-server | grep -Ei 'gtk|webkit|soup|javascriptcore'
