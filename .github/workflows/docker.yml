name: Docker

# The image of the web version. A pull request that touches what goes into it builds it and
# starts it. A tag builds it for amd64 and arm64, publishes it to the GitHub Container Registry
# and starts what was published.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .hadolint.yaml
      - docker/**
      - docker-compose.yml
      - .env.example
      - crates/**
      - src/**
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/128x128.png
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - index.html
      - vite.config.ts
      - uno.config.ts
      - tsconfig*.json
      - .github/scripts/**
      - .github/workflows/docker.yml
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Dockerfile, scripts, compose file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Shell scripts
        run: shellcheck docker/*.sh

      - name: What the entrypoint decides, with stand-ins for the commands it runs
        run: docker/entrypoint-test.sh

      # The hash of a password contains `$`, which Compose reads as the start of a variable
      # unless the value is in single quotes in the .env file. The example has to be written so
      # that the value arrives as it was written. `config` prints every `$` doubled, so that
      # what it prints can be read again. That the value reaches a container as written is shown
      # by the image job, which starts the compose file for real.
      - name: The compose file, with the example .env
        run: |
          set -eu
          hash='$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$aGFzaGhhc2hoYXNoaGFzaA'
          {
            grep -vE '^(HITOMI_PASSWORD_HASH|LIBRARY_PATH|EXPORT_PATH)=' .env.example
            printf "HITOMI_PASSWORD_HASH='%s'\n" "$hash"
            echo "LIBRARY_PATH=$RUNNER_TEMP"
            echo "EXPORT_PATH=$RUNNER_TEMP"
          } > .env
          docker compose config --quiet
          got=$(docker compose config --format json | jq -r '.services["hitomi-downloader"].environment.HITOMI_PASSWORD_HASH')
          got=${got//\$\$/\$}
          test "$got" = "$hash" || { echo "the hash arrived as '$got'" >&2; exit 1; }
          # Without a login, a hash, a library or an export folder the compose file refuses, saying
          # what is missing.
          # Compose names only one of several missing variables, in no fixed order, so one is
          # left out at a time.
          missing() {
            name=$1
            assignments=()
            for pair in HITOMI_USERNAME=admin HITOMI_PASSWORD_HASH=hash "LIBRARY_PATH=$RUNNER_TEMP" "EXPORT_PATH=$RUNNER_TEMP"; do
              [ "${pair%%=*}" = "$name" ] || assignments+=("$pair")
            done
            if env -i PATH="$PATH" HOME="$HOME" "${assignments[@]}" docker compose --env-file /dev/null config > /dev/null 2> "$RUNNER_TEMP/compose-error"; then
              echo "the compose file accepted a missing $name" >&2; exit 1
            fi
            grep -q "$name" "$RUNNER_TEMP/compose-error" || { echo "no word of $name in:" >&2; cat "$RUNNER_TEMP/compose-error" >&2; exit 1; }
          }
          for name in HITOMI_USERNAME HITOMI_PASSWORD_HASH LIBRARY_PATH EXPORT_PATH; do missing "$name"; done

  image:
    name: Image (build and start, amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hitomi-downloader:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max

      - name: Start the image and check what it promises
        env:
          IMAGE: hitomi-downloader:ci
          REQUIRE_PUID_TESTS: '1'
          REQUIRE_HEALTH_STATUS: '1'
        run: docker/smoke-test.sh

      # The compose file as it is shipped, with an .env written like the example: the hash has
      # to arrive with its `$`, the long form of the bind mount has to work, and the login
      # has to accept the password the hash was made from.
      - name: The compose file runs the image
        run: |
          set -eu
          library="$RUNNER_TEMP/library"
          export="$RUNNER_TEMP/export"
          mkdir -p "$library" "$export"
          chmod 0777 "$library" "$export"
          hash=$(printf 'compose test password\n' | docker run --rm -i hitomi-downloader:ci hash-password)
          {
            echo "HITOMI_USERNAME=admin"
            printf "HITOMI_PASSWORD_HASH='%s'\n" "$hash"
            echo "LIBRARY_PATH=$library"
            echo "EXPORT_PATH=$export"
            echo "HITOMI_PORT=18080"
          } > .env
          cat > compose.ci.yml << 'EOF'
          services:
            hitomi-downloader:
              image: hitomi-downloader:ci
              pull_policy: never
          EOF
          docker compose -f docker-compose.yml -f compose.ci.yml up -d hitomi-downloader
          status=starting
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' hitomi-downloader)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy || { docker compose logs hitomi-downloader; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            http://127.0.0.1:18080/auth/login -d '{"username":"admin","password":"compose test password"}')
          test "$code" = 200 || { echo "the login answered $code" >&2; docker compose logs hitomi-downloader; exit 1; }
          docker compose -f docker-compose.yml -f compose.ci.yml down -v

  # What the release does first, and the same way: the image for both platforms at the same time,
  # with the version argument and the caches of the release. Without this the first time both
  # were built together was the publishing of a release, which failed because they shared a cache.
  #
  # The server is always compiled here, never taken from the cache: a cache hit would turn the
  # check green without compiling anything. On a tag the result goes to the cache the release
  # reads right after, so the release does not compile it a second time.
  #
  # A pull request builds both only when it touches what can differ between the two: the
  # Dockerfile, the dependencies and toolchain, this workflow and the version script. The Rust
  # code itself has nothing that depends on the architecture, the image job compiles it for amd64.
  platforms:
    name: Image for both platforms (as the release builds it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the merge commit of a pull request and its first parent, the base
          fetch-depth: 2

      - name: Does the change concern both platforms
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|src-tauri/Cargo\.toml|rust-toolchain(\.toml)?|\.cargo/.*|\.github/workflows/docker\.yml|\.github/scripts/set-version\.mjs)$'
          if git diff --name-only HEAD^1 HEAD | grep -E "$pattern"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that differs between amd64 and arm64 changed, the image job covers it"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          # the version of the tag, as the release passes it, and a pre-release otherwise
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-ci' }}
          no-cache-filters: server
          cache-from: type=gha,scope=image-multi
          cache-to: type=gha,scope=image-multi,mode=max

  publish:
    name: Publish (amd64 and arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, image, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the last stage of the image runs under emulation, to install its few packages. The
      # server itself is compiled for arm64 on the amd64 machine.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 and 1.2 and 1 and latest for a release, only 1.2.3-rc.1 for a pre-release
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=hitomi-downloader
            org.opencontainers.image.description=The web version of hitomi-downloader

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version of the image is the version of the tag, see .github/scripts/set-version.mjs
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=image-multi
          cache-to: type=gha,scope=image-multi,mode=max

      # What was published has to start, on both platforms. arm64 runs under emulation here.
      - name: Start what was published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker pull --platform "$platform" "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" PLATFORM="$platform" EXPECT_VERSION="${TAG#v}" \
              REQUIRE_PUID_TESTS=1 REQUIRE_HEALTH_STATUS=1 docker/smoke-test.sh
            echo "::endgroup::"
          done
