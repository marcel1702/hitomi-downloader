name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/version to release, e.g. v0.1.5-test1 (creates the tag if it does not exist yet)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - name: Compute version and tag name
        id: vars
        shell: bash
        run: |
          tag_name="${{ inputs.version }}"
          if [ -z "$tag_name" ]; then
            tag_name="${GITHUB_REF_NAME}"
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${tag_name#v}" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prep, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Package release assets (Linux, amd64)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prep.outputs.version }}"
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb "release-assets/hitomi-downloader_${version}_linux_amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "release-assets/hitomi-downloader_${version}_linux_amd64.rpm"
          tar -C src-tauri/target/release -czf "release-assets/hitomi-downloader_${version}_linux_amd64_portable.tar.gz" hitomi-downloader

      - name: Package release assets (Windows, x64)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = "${{ needs.prep.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/hitomi-downloader_${version}_windows_x64.exe"
          Compress-Archive -Path "src-tauri/target/release/hitomi-downloader.exe" -DestinationPath "release-assets/hitomi-downloader_${version}_windows_x64_portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag_name }}
          name: 'hitomi-downloader ${{ needs.prep.outputs.tag_name }}'
          draft: true
          prerelease: false
          files: release-assets/*
