name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the only place a version is written. It goes into the files before anything
      # is built, so the About dialogs, `/api/health` and the ComicInfo.xml of the downloads
      # all say what the installers are called. A tag that is not a version stops the job here.
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/set-version.mjs "$TAG"

      - name: Keep the version of the repository
        if: github.ref_type != 'tag'
        shell: bash
        run: echo "Not a tag, so the version in the repository is built (a manual run)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Package release assets (Linux, amd64)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp target/release/bundle/deb/*.deb "release-assets/hitomi-downloader_${version}_linux_amd64.deb"
          cp target/release/bundle/rpm/*.rpm "release-assets/hitomi-downloader_${version}_linux_amd64.rpm"
          tar -C target/release -czf "release-assets/hitomi-downloader_${version}_linux_amd64_portable.tar.gz" hitomi-downloader

      - name: Package release assets (Windows, x64)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/hitomi-downloader_${version}_windows_x64.exe"
          Compress-Archive -Path "target/release/hitomi-downloader.exe" -DestinationPath "release-assets/hitomi-downloader_${version}_windows_x64_portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'hitomi-downloader ${{ github.ref_name }}'
          draft: true
          # a tag with a pre-release such as v1.2.3-rc.1 is published as a pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
