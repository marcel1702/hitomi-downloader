# hitomi-downloader (the web version)
#
#   cp .env.example .env      then fill in .env
#   docker compose up -d
#
# Every path is a placeholder you set in .env, none of them is a given. The library is only a
# directory for the containers: a folder on the Docker host, a named volume, or a folder that
# is itself an NFS or SMB share mounted on the host.

volumes:
  hitomi-config:

services:
  hitomi-downloader:
    image: ghcr.io/marcel1702/hitomi-downloader:latest
    container_name: hitomi-downloader
    restart: unless-stopped
    ports:
      # The web version asks for a login, but it should still not face the internet without
      # https. Put a reverse proxy in front of it for that, and set HITOMI_PUBLIC_URL below.
      - "${HITOMI_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      # Who owns the files that are written, and which rights they get. PUID and PGID have to be
      # a user the library and the export folder may be written by (on an NFS share, what its
      # settings allow).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      HITOMI_USERNAME: ${HITOMI_USERNAME:?set HITOMI_USERNAME in .env}
      # In the .env file the hash is written in single quotes. Written here, in this file, every
      # `$` of it would have to be doubled to `$$`.
      HITOMI_PASSWORD_HASH: "${HITOMI_PASSWORD_HASH:?create the hash with the command docker run --rm -it ghcr.io/marcel1702/hitomi-downloader hash-password}"
      # Where the data is mounted in this container, any paths will do as long as they match the
      # targets of the volumes below.
      HITOMI_CONFIG_DIR: /data/config
      HITOMI_LIBRARY_DIR: /data/library
      HITOMI_EXPORT_DIR: /data/export
      # The settings below are made in .env, see .env.example. An empty value counts as not set.
      HITOMI_FOLLOW_INTERVAL_HOURS: ${HITOMI_FOLLOW_INTERVAL_HOURS:-6}
      HITOMI_PUBLIC_URL: ${HITOMI_PUBLIC_URL:-}
      HITOMI_TRUST_FORWARDED_FOR: ${HITOMI_TRUST_FORWARDED_FOR:-}
      HITOMI_SESSION_DAYS: ${HITOMI_SESSION_DAYS:-}
      HITOMI_MAX_NAME_BYTES: ${HITOMI_MAX_NAME_BYTES:-}
    volumes:
      # config.json, the logins, the logs, the download queue, the followed searches and the pages
      # of running downloads
      - hitomi-config:/data/config
      # The library, where the comics are. The long form with create_host_path: false
      # makes the container refuse to start if the source is missing, for example because an NFS
      # share is not mounted. With the short form Docker would make an empty folder on the host
      # and the downloads would go to its local disk without anyone noticing.
      - type: bind
        source: ${LIBRARY_PATH:?set LIBRARY_PATH in .env}
        target: /data/library
        bind:
          create_host_path: false
      # The exports, mounted the same way. The folder must not lie inside the library on the host
      # either, a scan of the library would list them a second time. The server only sees the
      # paths in the container, it can not tell.
      - type: bind
        source: ${EXPORT_PATH:?set EXPORT_PATH in .env}
        target: /data/export
        bind:
          create_host_path: false
